services:
  - type: web
    name: coldchain-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/neon/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: IOT_INGEST_SECRET
        generateValue: true
      - key: AIML_SERVICE_TOKEN
        sync: false
      - key: AI_ML_API_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: coldchain-aiml
    runtime: python
    plan: starter
    rootDir: ai-ml
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: BACKEND_API_URL
        sync: false
      - key: AIML_SERVICE_TOKEN
        sync: false
      - key: IOT_INGEST_SECRET
        sync: false
